<script>
const A={},M={"first_zombie": {"name": "first_zombie", "fps": 20, "frameW": 309, "frameH": 220, "cols": 6, "frames": 107, "duration": 5.35, "sheets": [{"file": "first_zombie_0.webp", "frames": 54}, {"file": "first_zombie_1.webp", "frames": 53}], "audio": "first_zombie.mp3"}, "angry1": {"name": "angry1", "fps": 20, "frameW": 166, "frameH": 220, "cols": 12, "frames": 120, "duration": 6.0, "sheets": [{"file": "angry1_0.webp", "frames": 108}, {"file": "angry1_1.webp", "frames": 12}], "audio": "angry1.mp3"}, "angry2": {"name": "angry2", "fps": 20, "frameW": 290, "frameH": 220, "cols": 7, "frames": 71, "duration": 3.55, "sheets": [{"file": "angry2_0.webp", "frames": 63}, {"file": "angry2_1.webp", "frames": 8}], "audio": "angry2.mp3"}, "eat1": {"name": "eat1", "fps": 20, "frameW": 291, "frameH": 220, "cols": 7, "frames": 120, "duration": 6.0, "sheets": [{"file": "eat1_0.webp", "frames": 63}, {"file": "eat1_1.webp", "frames": 57}], "audio": "eat1.mp3"}, "eat2": {"name": "eat2", "fps": 20, "frameW": 355, "frameH": 220, "cols": 5, "frames": 113, "duration": 5.65, "sheets": [{"file": "eat2_0.webp", "frames": 45}, {"file": "eat2_1.webp", "frames": 45}, {"file": "eat2_2.webp", "frames": 23}], "audio": "eat2.mp3"}, "pistol": {"name": "pistol", "fps": 24, "frameW": 171, "frameH": 70, "cols": 11, "frames": 19, "duration": 0.79, "sheets": [{"file": "pistol.webp", "frames": 19}], "audio": "pistol.mp3"}, "shotgun": {"name": "shotgun", "fps": 24, "frameW": 175, "frameH": 70, "cols": 11, "frames": 31, "duration": 1.29, "sheets": [{"file": "shotgun.webp", "frames": 31}], "audio": "shotgun.mp3"}, "rpg": {"name": "rpg", "fps": 24, "frameW": 197, "frameH": 70, "cols": 10, "frames": 81, "duration": 3.38, "sheets": [{"file": "rpg.webp", "frames": 81}], "audio": "rpg.mp3"}, "zombie": {"name": "zombie", "fps": 12, "frameW": 380, "frameH": 200, "cols": 5, "frames": 72, "duration": 6.0, "sheets": [{"file": "zombie_0.webp", "frames": 50}, {"file": "zombie_1.webp", "frames": 22}], "audio": "zombie.mp3"}, "fear": {"name": "fear", "fps": 20, "frameW": 265, "frameH": 220, "cols": 7, "frames": 120, "duration": 6.0, "sheets": [{"file": "fear_0.webp", "frames": 63}, {"file": "fear_1.webp", "frames": 57}], "audio": "fear.mp3"}, "fight": {"name": "fight", "fps": 20, "frameW": 192, "frameH": 220, "cols": 10, "frames": 9, "duration": 0.45, "sheets": [{"file": "fight.webp", "frames": 9}], "audio": "fight.mp3"}};
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
let W,H,Z=1,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;Z=Math.max(.5,Math.min(W/1100,H/620,1.3))}
addEventListener('resize',rs);rs();
const U=p=>A[p]||'assets/'+p;
const img=(...ps)=>new Promise(r=>{let i=0;const t=()=>{const m=new Image();m.onload=()=>r(m);m.onerror=()=>++i<ps.length?t():r(null);m.src=U(ps[i])};t()});
let IT={},TL=[],SHOP=null,SF={},ac=null,cur=null;
async function load(){
 for(const k in M){const m=M[k];m.im=await Promise.all(m.sheets.map(s=>img('anim/'+s.file)));m.per=m.sheets[0].frames}

 for(const n of[16,17,18]){const t=await img('tiles/t'+n+'.webp','tiles/t'+n+'.png');if(t)TL.push(t)}
 SHOP=await img('tiles/shop.webp','tiles/shop.png');

}
async function aud(k){const u=U('sfx/'+M[k].audio);let b;
 if(u.startsWith('data:')){const s=atob(u.split(',')[1]);b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);b=b.buffer}
 else b=await(await fetch(u)).arrayBuffer();
 return new Promise(r=>ac.decodeAudioData(b,r,()=>r(null)))}
function snd(k,stop){const b=SF[k];if(!b||!ac)return;if(stop&&cur)try{cur.stop()}catch(e){}

// ---------- мир ----------
const WS=5000,TW=380,TH=250,LAB={x:2500,y:2300};
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;
const WN={pistol:'Пистолет',shotgun:'Дробовик',rpg:'РПГ'},WO=['pistol','shotgun','rpg'];
let P,ZS,DR,BU,taken,seen,rx,t=0,fireHeld=false,joy=null,mx=0,my=0,keys={},started=false,over=false,cdA=0,cdF=0,hurt=0,did=0,msgT=0;
function newGame(sv){
 const R=rng(7);taken=new Set(sv?sv.taken:[]);seen=sv?sv.seen:false;rx=null;over=false;BU=[];did=0;
 P={x:700,y:4400,hp:100,f:1,own:{pistol:0,shotgun:0,rpg:0},ammo:{pistol:0,shotgun:0,rpg:0},cur:null,kills:0,cd:0,wt:99,boost:0,step:0};
 if(sv)Object.assign(P,sv.p);
 ZS=[];const dead=new Set(sv?sv.dead:[]);
 for(let i=0;i<36;i++){let x,y;
  if(i<12){const a=R()*6.28,d=250+R()*450;x=LAB.x+Math.cos(a)*d;y=LAB.y+Math.sin(a)*d}
  else{do{x=300+R()*(WS-600);y=300+R()*(WS-600)}while(Math.hypot(x-700,y-4400)<1100)}
  ZS.push({id:i,x,y,hx:x,hy:y,hp:3,ph:R()*6,tx:x,ty:y,tt:0,sp:55+R()*30,f:1,dead:dead.has(i),da:dead.has(i)?9:0})}
 DR=[];const add=(k,x,y)=>{const id='i'+DR.length;if(!taken.has(id))DR.push({id,k,x,y})};
 add('pistol',860,4330);add('shotgun',2100,3300);add('rpg',LAB.x-330,LAB.y+420);
 for(let i=0;i<3;i++)add('chekushka',1150+i*70,4400);
 for(let i=0;i<26;i++)add(['apple','banana','sliva'][i%3],200+R()*(WS-400),200+R()*(WS-400));
 add('chekushka',LAB.x+380,LAB.y-120);add('chekushka',3800,1200);add('chekushka',1200,1600);
}
function react(k,pr){if(rx&&rx.t<rx.dur&&rx.pr>=pr)return;rx={k,t:0,dur:M[k].duration,pr};snd(k,true)}
const rnd=a=>a[Math.random()*a.length|0];
function aim(){let a=P.f>0?0:Math.PI;
 if(!touch&&mx){a=Math.atan2((my-H/2)/Z+70,(mx-W/2)/Z)}
 else{let b=600;for(const z of ZS)if(!z.dead){const d=Math.hypot(z.x-P.x,z.y-P.y);if(d<b){b=d;a=Math.atan2(z.y-P.y-30,z.x-P.x)}}}
 return a}
function fire(){if(P.cd>0||over)return;const w=P.cur,a=aim();P.f=Math.cos(a)>=0?1:-1;
 if(!w){P.cd=.45;if(!rx||rx.t>=rx.dur){rx={k:'fight',t:0,dur:M.fight.duration,pr:0};snd('fight',true)}
  let b=null,bd=110;for(const z of ZS)if(!z.dead){const d=Math.hypot(z.x-P.x-P.f*50,z.y-P.y);if(d<bd){bd=d;b=z}}
  if(b)hit(b,P.boost>0?2:1,a);return}
 if(w!=='pistol'&&P.ammo[w]<=0){P.cur=nextW();return}
 const ox=P.x+P.f*80,oy=P.y-60,k=P.boost>0?2:1;snd(w);P.wt=0;
 if(w==='pistol'){P.cd=.32;B(ox,oy,a,900,.8,1*k)}
 else if(w==='shotgun'){P.cd=.9;P.ammo[w]--;for(let i=0;i<6;i++)B(ox,oy,a+(i-2.5)*.07,850,.4,1*k)}
 else{P.cd=1.6;P.ammo[w]--;B(ox,oy,a,560,1.4,5*k,1)}}
function B(x,y,a,s,l,d,r){BU.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,d,r})}
function nextW(){const o=WO.filter(w=>P.own[w]&&(w==='pistol'||P.ammo[w]>0));const i=o.indexOf(P.cur);return o.length?o[(i+1)%o.length]:null}
function hit(z,d,a){if(z.dead)return;z.hp-=d;z.x+=Math.cos(a)*16;z.y+=Math.sin(a)*16;
 if(z.hp<=0){z.dead=1;z.da=0;P.kills++;if(Math.random()<.35)DR.push({id:'d'+did++,k:rnd(['apple','banana','sliva','chekushka']),x:z.x,y:z.y})}}
function hurtP(d){P.hp-=d;if(hurt<-.5)hurt=.18;
 if(cdA<=0&&(!rx||rx.t>=rx.dur)){react(rnd(['angry1','angry2']),1);cdA=9}}
function pick(d){taken.add(d.id);DR.splice(DR.indexOf(d),1);
 if(WO.includes(d.k)){P.own[d.k]=1;P.ammo[d.k]+=d.k==='pistol'?40:d.k==='shotgun'?14:4;P.cur=d.k;msgT=2;return}
 P.hp=Math.min(100,P.hp+{apple:15,banana:25,sliva:20,chekushka:50}[d.k]);
 if(d.k==='chekushka')P.boost=10;
 react(rnd(['eat1','eat2']),3)}
function upd(dt){
 let ix=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),iy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
 if(joy){ix=joy.dx;iy=joy.dy}
 const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
 const sp=230*(P.boost>0?1.3:1);P.x=Math.max(60,Math.min(WS-60,P.x+ix*sp*dt));P.y=Math.max(120,Math.min(WS-40,P.y+iy*sp*dt));
 if(l>.1){P.step+=dt*(l>0?1:0);if(Math.abs(ix)>.2)P.f=ix>0?1:-1}
 P.cd-=dt;P.wt+=dt;P.boost-=dt;cdA-=dt;cdF-=dt;hurt-=dt;msgT-=dt;t+=dt;
 if(rx){rx.t+=dt;if(rx.t>=rx.dur)rx=null}
 if(fireHeld)fire();
 let near=0;
 for(const z of ZS){if(z.dead){z.da+=dt;continue}
  const dx=P.x-z.x,dy=P.y-z.y,d=Math.hypot(dx,dy);
  if(d<440&&!seen){seen=true;react('first_zombie',4)}
  if(d<460){z.x+=dx/d*(z.sp+22)*dt;z.y+=dy/d*(z.sp+22)*dt;z.f=dx>0?1:-1;near++}
  else{z.tt-=dt;if(z.tt<=0){z.tx=z.hx+(Math.random()-.5)*400;z.ty=z.hy+(Math.random()-.5)*400;z.tt=2+Math.random()*3}
   const ex=z.tx-z.x,ey=z.ty-z.y,e=Math.hypot(ex,ey);if(e>8){z.x+=ex/e*28*dt;z.y+=ey/e*28*dt;z.f=ex>0?1:-1}}
  if(d<55)hurtP(10*dt)}
 if(P.hp<35&&near>=3&&cdF<=0&&(!rx||rx.t>=rx.dur)){react('fear',2);cdF=14}
 for(let i=BU.length-1;i>=0;i--){const b=BU[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;let rm=b.l<=0;
  if(!rm)for(const z of ZS)if(!z.dead&&Math.hypot(z.x-b.x,z.y-(b.y+80))<50){
   if(b.r){for(const q of ZS)if(!q.dead&&Math.hypot(q.x-z.x,q.y-z.y)<150)hit(q,b.d,0);b.boom=1}else hit(z,b.d,Math.atan2(b.vy,b.vx));rm=true;break}
  if(rm){if(b.r&&!b.boom){for(const q of ZS)if(!q.dead&&Math.hypot(q.x-b.x,q.y-b.y-80)<150)hit(q,b.d,0)}BU.splice(i,1)}}
 for(const d of DR.slice())if(Math.hypot(d.x-P.x,d.y-P.y)<55)pick(d);
 if(P.hp<=0&&!over){over=true;try{localStorage.removeItem('mell1')}catch(e){}scr('Мелл не выжил','Зомби взяли своё. Но Мытищи ещё можно спасти.','Заново')}
 else if(!over&&ZS.every(z=>z.dead)){over=true;try{localStorage.removeItem('mell1')}catch(e){}scr('ПОБЕДА!','Все зомби повержены, Мытищи зачищены. Мелл, ты легенда.','Играть ещё')}
 $('hp').style.width=Math.max(0,P.hp)+'%';
 $('wt').textContent=(P.cur?WN[P.cur]+' '+(P.cur==='pistol'?'∞':P.ammo[P.cur]):'Кулаки')+(P.boost>0?' 🍾':'');
 $('zl').textContent='Зомби: '+ZS.filter(z=>!z.dead).length}
function fr(k,tm,x,y,s,fl,tilt,loop=true,al=1){const m=M[k];let i=Math.floor(tm*m.fps);i=loop?i%m.frames:Math.min(i,m.frames-1);
 const sh=m.im[Math.floor(i/m.per)],j=i%m.per,w=m.frameW,h=m.frameH;if(!sh)return;
 ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);if(tilt)ctx.rotate(tilt);if(fl)ctx.scale(-1,1);
 ctx.drawImage(sh,(j%m.cols)*w,Math.floor(j/m.cols)*h,w,h,-w*s/2,-h*s,w*s,h*s);ctx.restore()}
function ground(cx,cy){
 const x0=Math.floor(cx/TW),x1=Math.floor((cx+W/Z)/TW),y0=Math.floor(cy/TH),y1=Math.floor((cy+H/Z)/TH);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const h=((tx*73856093)^(ty*19349663))>>>0;
  if(TL.length)ctx.drawImage(TL[h%TL.length],tx*TW,ty*TH,TW+1,TH+1);
  else{ctx.fillStyle=['#5b4630','#54402b','#604a33'][h%3];ctx.fillRect(tx*TW,ty*TH,TW+1,TH+1);
   ctx.fillStyle='#0002';for(let i=0;i<5;i++)ctx.fillRect(tx*TW+(h>>(i*3)&255)%TW*.9,ty*TH+(h>>(i*2)&255)%TH*.9,26+i*9,8+i*3)}}
}
function draw(){
 const cx=P.x-W/2/Z,cy=P.y-H/2/Z;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.setTransform(dpr*Z,0,0,dpr*Z,-cx*dpr*Z,-cy*dpr*Z);ctx.imageSmoothingQuality='high';
 ground(cx,cy);
 ctx.fillStyle='#000b';ctx.fillRect(-2000,-2000,2000,WS+4000);ctx.fillRect(WS,-2000,2000,WS+4000);ctx.fillRect(0,-2000,WS,2000);ctx.fillRect(0,WS,WS,2000);
 // лаборатория
 ctx.fillStyle='#1c2a1c';ctx.fillRect(LAB.x-260,LAB.y-300,520,300);ctx.fillStyle='#39ff14';ctx.globalAlpha=.25;ctx.fillRect(LAB.x-260,LAB.y-300,520,300);ctx.globalAlpha=1;
 ctx.strokeStyle='#39ff14';ctx.lineWidth=6;ctx.strokeRect(LAB.x-260,LAB.y-300,520,300);ctx.fillStyle='#fff';ctx.font='700 38px system-ui';ctx.textAlign='center';ctx.fillText('ДАБАЛАБОРАТОРИЯ',LAB.x,LAB.y-140);ctx.font='24px system-ui';ctx.fillText('☣ не входить ☣',LAB.x,LAB.y-100);
 // магазин
 if(SHOP)ctx.drawImage(SHOP,1000-SHOP.width*.4,4300-SHOP.height*.8,SHOP.width*.8,SHOP.height*.8);
 else{ctx.fillStyle='#2a4a8a';ctx.fillRect(900,4150,260,150);ctx.fillStyle='#fff';ctx.font='700 40px system-ui';ctx.fillText('ЧЕКУШКА',1030,4240)}
 for(const d of DR){const b=Math.sin(t*4+d.x)*4,i=IT[d.k];ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(d.x,d.y,24,8,0,0,7);ctx.fill();
  ctx.fillStyle=d.k==='chekushka'?'#7cf8':'#ffe60044';ctx.beginPath();ctx.arc(d.x,d.y-22+b,32,0,7);ctx.fill();
  if(i)ctx.drawImage(i,d.x-i.width*.4,d.y-i.height*.8-6+b,i.width*.8,i.height*.8);else fr(d.k,0,d.x,d.y+b,1.1,0,0)}
 const E=[];for(const z of ZS)if(z.da<.7)E.push(z);E.push(P);E.sort((a,b)=>a.y-b.y);
 for(const e of E){
  if(e===P){const mv=Math.abs(Math.sin(P.step*9));ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(P.x,P.y,50,12,0,0,7);ctx.fill();
   if(P.boost>0){ctx.fillStyle='#7cf5';ctx.beginPath();ctx.arc(P.x,P.y-80,95,0,7);ctx.fill()}
   const bob=(keys.w||keys.a||keys.s||keys.d||joy)?-mv*8:Math.sin(t*2)*1.5,til=(joy||keys.a||keys.d||keys.w||keys.s)?Math.sin(P.step*9)*.05:0;
   if(rx)fr(rx.k,rx.t,P.x,P.y+bob,.8,P.f<0,til,false);else fr('first_zombie',0,P.x,P.y+bob,.8,P.f<0,til);
   if(P.cur)fr(P.cur,P.wt,P.x+P.f*50,P.y-38+bob,.9,P.f<0,0,false)}
  else{ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(e.x,e.y,44,11,0,0,7);ctx.fill();
   const al=e.dead?1-e.da/.7:1;fr('zombie',t+e.ph,e.x,e.y,.85+(e.dead?e.da*.3:0),e.f<0,0,true,al)}}
 for(const b of BU){ctx.fillStyle=b.r?'#ff7a00':'#ffe34d';ctx.beginPath();ctx.arc(b.x,b.y,b.r?9:4,0,7);ctx.fill()}
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(hurt>0){ctx.fillStyle='rgba(255,0,0,'+Math.min(.28,hurt*1.4)+')';ctx.fillRect(0,0,W,H)}
 if(msgT>0&&P.cur){ctx.fillStyle='#fff';ctx.font='700 22px system-ui';ctx.textAlign='center';ctx.fillText('Взял: '+WN[P.cur],W/2,H*.2)}
 if(joy){ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.x,joy.y,50,0,7);ctx.stroke();ctx.fillStyle='#fff6';ctx.beginPath();ctx.arc(joy.x+joy.dx*50,joy.y+joy.dy*50,24,0,7);ctx.fill()}}
// ---------- управление ----------
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=1;
