<div id="scr"><h1 id="ttl">МЕЛЛСТРОЙ vs ЗОМБИ</h1><p id="msg">В родном городе Меллстроя, пока он был в запое в зомби дабалатории под магазином Чекушки произошла утечка. Все жители кроме Мелла стали зомби и захватили город. Наш герой в страхе за свой любимый магазин пошел освобождать город от наглых зомбей.</p>
